services:
  app:
    build:
      context: .
      dockerfile: .docker/php.Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - laravel-net

  webserver:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel-net

  db:
    image: mysql:8.0
    container_name: laravel_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: root
      MYSQL_ROOT_PASSWORD: 123456
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel-net

  flask:
    build: ./flask
    container_name: flask_app
    ports:
      - "5001:5000"
    environment:
      - FLASK_ENV=development
    restart: unless-stopped
    
networks:
  laravel-net:
    driver: bridge

volumes:
  dbdata:
    driver: local